<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Chrome Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-row">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="12" stroke="url(#grad)" stroke-width="2.5" fill="none"/>
            <circle cx="14" cy="14" r="5" fill="url(#grad)"/>
            <path d="M14 2 L14 6 M14 22 L14 26 M2 14 L6 14 M22 14 L26 14" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="28" y2="28">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Antigravity</h1>
          <span class="subtitle">Chrome Bridge</span>
        </div>
      </div>
    </header>

    <!-- Connection Status -->
    <div class="status-card" id="statusCard">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">確認中...</span>
      </div>
      <div class="status-details" id="statusDetails"></div>
    </div>

    <!-- Server URL Setting -->
    <div class="setting-group">
      <label class="setting-label" for="serverUrl">サーバーURL</label>
      <div class="input-row">
        <input
          type="text"
          id="serverUrl"
          class="input-field"
          placeholder="ws://localhost:8767"
          spellcheck="false"
        />
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="btn btn-primary" id="connectBtn">
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        接続
      </button>
      <button class="btn btn-secondary" id="disconnectBtn" disabled>
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor"/>
        </svg>
        切断
      </button>
    </div>

    <!-- Tab Group Info -->
    <div class="info-card" id="groupInfo" style="display:none;">
      <div class="info-header">
        <span class="info-icon">📂</span>
        <span class="info-title">タブグループ</span>
      </div>
      <p class="info-text" id="groupText"></p>
    </div>

    <!-- Quick Help -->
    <div class="help-section">
      <details>
        <summary class="help-toggle">使い方</summary>
        <div class="help-content">
          <ol>
            <li><code>server/</code>フォルダでブリッジサーバーを起動</li>
            <li>「接続」ボタンをクリック</li>
            <li>Antigravityからコマンドを送信</li>
          </ol>
          <p class="help-note">操作は自動的に「🤖 Antigravity」タブグループ内で行われます。</p>
        </div>
      </details>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
