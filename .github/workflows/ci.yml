name: CI

on:
  push:
    branches:
      - master
      - main
      - "feat/**"
  pull_request:

jobs:
  ci:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package Chrome extension
        run: pnpm package:extension

      - name: Upload extension ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-chrome-bridge-extension
          path: release/antigravity-chrome-bridge-extension-v2.0.0.zip
          if-no-files-found: error
